# Local hooks only: everything shells out to pwsh, so no third-party hook repo
# runs code in the commit path.
#
# Quality floor (raise it, never lower it):
#   * PSScriptAnalyzer: zero Error and zero Warning findings, gated at commit
#     on the changed files only, so day-to-day commits stay fast.
#   * Pester: the full suite green, gated at push.
#   * Coverage: 43% statement coverage of Invoke-YtDlp.ps1, the -CoverageFloor
#     default in tools/Invoke-Tests.ps1. When a change pushes coverage above the
#     floor, raise the floor in the same change to lock the gain in.
#
# Install both hook types with:  pre-commit install --install-hooks
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: psscriptanalyzer
        name: PSScriptAnalyzer (changed files)
        entry: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/Invoke-Analyzer.ps1
        language: system
        files: \.(ps1|psm1|psd1)$
        pass_filenames: true
        stages: [pre-commit]

      - id: pester
        name: Pester (full suite + coverage floor)
        entry: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File tools/Invoke-Tests.ps1
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
